name: pcl-version

# 抓取 PCL 仓库里 AssemblyInfo.vb 的版本号，写进 docs/pcl-version.json，
# 供 README 的动态徽章使用（raw.githubusercontent 不受 GitHub API 限流影响）。

on:
  schedule:
    - cron: '0 3 * * *'   # 每天 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read PCL version
        id: pcl
        run: |
          set -euo pipefail
          URL='https://raw.githubusercontent.com/Meloong-Git/PCL/main/Plain%20Craft%20Launcher%202/My%20Project/AssemblyInfo.vb'
          VER=$(curl -fsSL "$URL" | grep -oP 'AssemblyVersion\("\K[0-9]+(\.[0-9]+)+' | head -1)
          if [ -z "$VER" ]; then
            echo "无法解析版本号，跳过"; exit 0
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "PCL 最新版本: $VER"

      - name: Update docs/pcl-version.json
        run: |
          set -euo pipefail
          VER='${{ steps.pcl.outputs.version }}'
          [ -z "$VER" ] && exit 0
          printf '{\n  "version": "%s",\n  "source": "Meloong-Git/PCL AssemblyInfo.vb"\n}\n' "$VER" > docs/pcl-version.json

      - name: Commit if changed
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- docs/pcl-version.json; then
            echo "版本号未变化"; exit 0
          fi
          git add docs/pcl-version.json
          git commit -m "chore: 同步 PCL 版本号 ${{ steps.pcl.outputs.version }}"
          git push
