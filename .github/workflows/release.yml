name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build
        run: dotnet build pcl2-patch.sln -c Release

      - name: Publish single-file GUI
        run: dotnet publish src/Pcl2Patch.Gui/Pcl2Patch.Gui.csproj -c Release -o dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pcl2-patch-gui
          path: dist/pcl2-patch-gui.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/pcl2-patch-gui.exe
          generate_release_notes: true
